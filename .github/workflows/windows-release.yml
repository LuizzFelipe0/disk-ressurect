name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Python packager
        run: python -m pip install -r packaging/windows/requirements.txt

      - name: Run backend unit tests
        run: python -m unittest discover -s backend/src/tests -v

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend and Electron main process
        run: npm run build
        working-directory: frontend

      - name: Package Python recovery service
        run: python -m PyInstaller --noconfirm --clean --distpath dist/backend --workpath build/pyinstaller packaging/windows/DiskRessurect.spec

      - name: Package Windows installer
        run: npm run package:win
        working-directory: frontend

      - name: Create portable package and checksums
        shell: pwsh
        run: |
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "^v$([regex]::Escape($version))(-.+)?$"
          if ($env:GITHUB_REF_NAME -notmatch $expectedTag) { throw "Release tag must match package version $version (for example v$version or v$version-test)." }
          $portablePath = "dist/DiskRessurect-$version-win-x64-portable.zip"
          $installerPath = "dist/DiskRessurect-$version-win-x64-Setup.exe"
          $appExecutable = "dist/win-unpacked/Disk Ressurect.exe"
          if (-not (Test-Path $installerPath)) { throw "Installer was not generated: $installerPath" }
          if (-not (Test-Path $appExecutable)) { throw "Portable application was not generated: $appExecutable" }
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath $portablePath -CompressionLevel Optimal
          $assets = @($installerPath, $portablePath)
          $hashes = $assets | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_
            "$($hash.Hash)  $([System.IO.Path]::GetFileName($_))"
          }
          Set-Content -LiteralPath dist/SHA256SUMS.txt -Value $hashes -Encoding ascii

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-files
          path: |
            dist/DiskRessurect-*-win-x64-Setup.exe
            dist/DiskRessurect-*-win-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: windows-release-files
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Disk Ressurect ${{ github.ref_name }}
          body: |
            Windows x64 test build.

            - **Setup EXE** installs Disk Ressurect.
            - **Portable ZIP** contains the one-folder app; extract it and run `Disk Ressurect.exe`.
            - **SHA256SUMS.txt** verifies the downloaded files.

            Disk access requires Windows administrator permission. These executables are unsigned, so Windows may show a SmartScreen publisher warning.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-files/*
